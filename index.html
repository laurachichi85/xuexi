<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anh–Trung song hành</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: top bar with five views; each view is one reading column of cards. Blue marks English, seal red marks Chinese. */
  --bg:#fdf3f8; --surface:#ffffff; --ink:#4a4458; --muted:#857f96; --line:#eadff0;
  --en:#4a7fc4; --zh:#d45d7c; --good:#3f9a6e; --warn:#c07f2e; --soft:#f3ecfa; --pri:#8b7ad8;
  color-scheme:light;
  --body:"Be Vietnam Pro",system-ui,"Segoe UI",sans-serif;
  --han:"Noto Serif SC","Songti SC","SimSun",serif;
}
.catrun{position:fixed;left:0;bottom:64px;z-index:9;pointer-events:none;animation:catrun 4.2s linear forwards}
@keyframes catrun{from{transform:translateX(-160px)}to{transform:translateX(100vw)}}
.catrun svg{display:block;animation:hop .28s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-10px)}}
.meow{display:block;width:max-content;margin:0 0 4px 40px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:13.5px;font-weight:600;color:var(--zh)}
.lg,.tail{transform-box:fill-box}
.lg{transform-origin:top center}
.lg.a{animation:lega .28s linear infinite alternate}
.lg.b{animation:lega .28s linear infinite alternate-reverse}
@keyframes lega{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.tail{transform-origin:bottom right;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{to{transform:rotate(20deg)}}
.catsit{display:flex;justify-content:center;margin-bottom:6px}
.catsit .lg{animation:none}
#pet{position:fixed;right:10px;bottom:6px;z-index:8;background:none;border:0;padding:0;cursor:pointer}
#pet svg{display:block;width:90px;height:60px}
#pet .lg{animation:none}
#pet:hover svg,#pet.hop svg{animation:hop .28s ease-in-out 4 alternate}
@media (prefers-reduced-motion:reduce){.catrun{display:none}.tail,.lg{animation:none}}
.tile:nth-child(4n+1){background:#e9f2ff}.tile:nth-child(4n+2){background:#ffeaf1}.tile:nth-child(4n+3){background:#eafaf1}.tile:nth-child(4n+4){background:#fff6df}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--bg)}
body{min-height:100vh;background:linear-gradient(160deg,#fdeef5,#f4effc 50%,#eaf4ff) fixed;color:var(--ink);font:16px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--en);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:10px 16px}
.brand{display:flex;gap:10px;align-items:center}
.seal{font:700 20px/1 var(--han);color:#fff;background:var(--zh);width:36px;height:36px;display:grid;place-items:center;border-radius:6px}
.brand b{display:block;font-size:16px}
.brand small{color:var(--muted);font-size:12.5px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav a{padding:7px 12px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px}
nav a.on{background:var(--soft);color:var(--ink)}
main{max-width:860px;margin:0 auto;padding:20px 16px 110px;display:flex;flex-direction:column;gap:16px}
h1{font-size:24px;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 8px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1 1 220px;min-width:0}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.done{color:var(--good);border-color:var(--good)}
.pill.todo{color:var(--warn);border-color:var(--warn)}
.chip{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.chip.en{color:var(--en)} .chip.zh{color:var(--zh)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.vi{border-style:dashed;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.han{font-family:var(--han)}
.flash{text-align:center;padding:28px 16px}
.flash .w{font-size:38px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.flash .w.han{font-size:46px}
.flash .w2{font-size:26px;font-weight:600;margin-top:14px}
.py{color:var(--muted)}
.ex{text-align:left;border-left:3px solid var(--en);padding:2px 0 2px 12px;margin:12px 0 0}
.ex.z{border-color:var(--zh);font-family:var(--han);font-size:18px}
.vitext{display:inline-block;background:var(--soft);border-radius:6px;padding:6px 10px;margin-top:10px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:600}
.ask{font-weight:600}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt.han{font-size:18px}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt.ok{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.opt.no{border-color:var(--zh);box-shadow:inset 4px 0 0 var(--zh)}
.after{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.passage{max-width:65ch;background:var(--soft);border-radius:8px;padding:12px 14px}
.passage.han{font-size:18px;line-height:1.8}
.chunks{display:flex;flex-wrap:wrap;gap:6px;min-height:44px;padding:8px;border:1px dashed var(--line);border-radius:8px;margin-top:8px}
.chunk{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;cursor:pointer}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form .wide{grid-column:1/-1}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.mode{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.mode:hover{border-color:var(--muted)}
.mode b{display:block}
.mode span{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;min-width:80px;flex:1}
.bar i{display:block;height:100%;background:var(--en)}
.bar.z i{background:var(--zh)}
.note{border-left:3px solid var(--warn);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;font-size:14px}
.fb{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14.5px}
.fb:empty{display:none}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;max-width:90vw}
#toast:empty{display:none}
.tnum{font-variant-numeric:tabular-nums}
@media (max-width:520px){nav{margin-left:0}.flash .w{font-size:30px}.flash .w.han{font-size:38px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

const norm=s=>s.toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'');
function sim(a,b){a=norm(a);b=norm(b);if(!a.length||!b.length)return 0;const d=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}
  return 1-d[b.length]/Math.max(a.length,b.length)}

function srsBetter(x,y){return x[3]>y[3]||(x[3]===y[3]&&x[1]>y[1])}
function mergeState(a,b){const o=JSON.parse(JSON.stringify(a));o.srs=o.srs||{};o.log=o.log||{};o.custom=o.custom||[];
  for(const k in (b.srs||{})){const x=b.srs[k];if(!o.srs[k]||srsBetter(x,o.srs[k]))o.srs[k]=x}
  for(const d in (b.log||{})){const x=b.log[d],y=o.log[d];if(!y)o.log[d]=x;else o.log[d]={n:Math.max(y.n||0,x.n||0),r:Math.max(y.r||0,x.r||0),ex:Object.assign({},x.ex||{},y.ex||{})}}
  const ids=new Set(o.custom.map(c=>c.id));for(const c of (b.custom||[]))if(!ids.has(c.id))o.custom.push(c);
  if((b.ts||0)>(a.ts||0))o.cfg=Object.assign({},o.cfg,b.cfg);o.ts=Math.max(a.ts||0,b.ts||0);return o}
